<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Words 44</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F7BFF"/>
      <stop offset=".5" stop-color="#5B4CF0"/>
      <stop offset="1" stop-color="#8E3FEA"/>
    </linearGradient>
    <radialGradient id="pink" cx=".86" cy=".12" r=".55">
      <stop offset="0" stop-color="#FF7AB8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FF7AB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange" cx=".1" cy=".95" r=".6">
      <stop offset="0" stop-color="#FF9A4D" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FF9A4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx=".45" cy="-.05" r=".75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC4DD"/>
      <stop offset="1" stop-color="#FFB67D"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512"/></clipPath>
    <!-- one rounded geometric "4": stem, diagonal and crossbar -->
    <path id="four" d="M104 0 L0 140 L138 140 M104 0 L104 206" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#pink)"/>
    <rect width="512" height="512" fill="url(#orange)"/>
    <rect width="512" height="512" fill="url(#gloss)"/>
  </g>
  <g transform="translate(256 256) scale(.8) translate(-256 -256) translate(98 153)">
    <!-- depth layer -->
    <g stroke="#2B1A7A" stroke-opacity=".35" stroke-width="40" transform="translate(12 14)">
      <use href="#four"/><use href="#four" x="178"/>
    </g>
    <!-- warm layer -->
    <g stroke="url(#mid)" stroke-width="40" transform="translate(6 7)">
      <use href="#four"/><use href="#four" x="178"/>
    </g>
    <!-- front layer -->
    <g stroke="#FFFFFF" stroke-width="40">
      <use href="#four"/><use href="#four" x="178"/>
    </g>
  </g>
</svg>
