name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-preview
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - 'icons/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-web.cjs'
      - 'scripts/set-android-version.cjs'
      - '.github/workflows/android-preview.yml'

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Stage web app
        run: npm run build:web
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Set Android version metadata
        run: node scripts/set-android-version.cjs
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: words44-android-preview-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
