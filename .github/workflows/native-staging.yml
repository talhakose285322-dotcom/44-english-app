name: Native staging check

on:
  workflow_dispatch:
  push:
    branches: [android-capacitor-experiment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx cap add android
      - run: npm run cap:sync
      - run: npm run test:native-web
      - name: Verify generated Android OAuth deep link
        run: |
          grep -q 'android:scheme="com.words44.app"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:path="/callback"' android/app/src/main/AndroidManifest.xml
