name: Native staging check

on:
  workflow_dispatch:
  push:
    branches: [android-capacitor-experiment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build:native-web
      - run: npx cap add android
      - run: npm run cap:sync
      - run: npm run test:native-web
      - name: Verify generated Android OAuth deep link
        run: |
          grep -q 'android:scheme="com.words44.app"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:path="/callback"' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: words44-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
