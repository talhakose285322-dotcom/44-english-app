name: Native staging check

on:
  workflow_dispatch:
  push:
    branches: [android-capacitor-experiment]
  pull_request:
    branches: [main]

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:native-web
