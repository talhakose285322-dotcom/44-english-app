name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use Claude Code Action's built-in GitHub App authentication.
          # Do not pass GITHUB_TOKEN here; it disables the built-in bot identity.
          display_report: "true"
          claude_args: --max-turns 8
          prompt: |
            Follow the repository's CLAUDE.md and PROJECT_CONTEXT.md instructions if present.
            Make only the changes requested in the triggering comment.
            Preserve existing user data and avoid unrelated refactors.
            Run relevant targeted tests. Do not expose secrets or print environment variables.

            Triggering comment from the authorized repository user:
            ---
            ${{ github.event.comment.body }}
            ---

            Treat the comment above as the actual task. If it requests code changes, inspect the relevant files, make the requested changes, run tests, and report the result visibly. If blocked, explain the concrete blocker in a visible reply.

      - name: Publish Claude's final response to the issue
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/github-script@v7
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const turns = JSON.parse(fs.readFileSync(process.env.CLAUDE_EXECUTION_FILE, 'utf8'));
            const result = [...turns].reverse().find(turn => turn.type === 'result');
            const assistantText = turns
              .filter(turn => turn.type === 'assistant')
              .flatMap(turn => turn.message?.content ?? [])
              .filter(item => item.type === 'text' && item.text)
              .map(item => item.text.trim())
              .filter(Boolean);
            const response = (result?.result || assistantText.at(-1) || '').trim();
            const issue_number = context.payload.issue?.number ?? context.payload.pull_request?.number;
            if (!issue_number) throw new Error('Could not determine issue or pull request number.');
            const body = response
              ? `### Claude Code — final response\n\n${response}`
              : 'Claude Code ran, but did not return a final text response. Check the Actions run summary for details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
