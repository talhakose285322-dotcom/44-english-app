name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use Claude Code Action's built-in GitHub App authentication.
          # Do not pass GITHUB_TOKEN here; it disables the built-in bot identity.
          display_report: "true"
          claude_args: |
            --max-turns 8
            --allowedTools "Bash(git status:*),Bash(git branch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
          prompt: |
            Follow the repository's CLAUDE.md and PROJECT_CONTEXT.md instructions if present.
            Make only the changes requested in the triggering comment.
            Preserve existing user data and avoid unrelated refactors.
            Run relevant targeted tests. Do not expose secrets or print environment variables.

            Triggering comment from the authorized repository user:
            ---
            ${{ github.event.comment.body }}
            ---

            Treat the comment above as the actual task. If it requests code changes, inspect the relevant files, make the requested changes, run tests, and report the result visibly. If blocked, explain the concrete blocker in a visible reply.

            IMPORTANT: For issue_comment and pull_request_review_comment events, do not rely on the action's automatic report posting. After completing the task, post one concise, factual visible reply yourself using the GitHub CLI. Include the repository, current checkout branch (get it with git branch --show-current), what you actually did, and relevant test results. If no files changed, explicitly say so; if the task changed files, summarize those changes instead. Use:
            gh issue comment "${{ github.event.issue.number || github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "<your factual report>"
            Do not claim tests passed unless you ran them. If posting fails, report the concrete error. Never post secrets.

            PULL REQUEST RULE: When the requested task changes repository files on an issue-triggered run, create a draft pull request from the current task branch after targeted tests pass, using:
            gh pr create --draft --fill --base main
            Then include the resulting PR URL in your visible issue reply. Never merge a pull request, never add approval labels, and never deploy. If no files changed, do not create a PR. For pull_request_review_comment events, work only on the existing PR branch and do not create a second PR.
