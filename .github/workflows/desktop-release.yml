name: Build Words 44 desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: words44-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop packaging dependencies
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npm run dist:${{ matrix.target }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: words44-${{ matrix.target }}-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: cd installers && sha256sum Words44* > SHA256SUMS
      - name: Publish installers to a public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.10-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Words 44 Desktop 1.0.10 (build ${{ github.run_number }})
          draft: false
          generate_release_notes: true
          files: installers/*
